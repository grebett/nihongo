# Sample bundle YAML — paste/upload at /imported/ to test the importer.
# This is the same format an LLM would produce in "bundle mode"
# (see docs/LLM_PROMPT.md → Mode B).

lesson:
  id: test-import
  title: "Test — Import"
  description: "Small lesson to test the importer"
  source: "Sample"
  videoId: ""
  number: 99
  # coverImage accepts either an HTTPS URL or an inline data URI.
  # Here a small 200x112 red SVG with "test" as a demo.
  coverImage: "data:image/svg+xml;base64,"
  sections:
    - id: vocabulary
      title: "Vocabulary"
      description: "Three small exercises to test all 4 question types"
      parts:
        - id: matching-colors
          title: "Colors (matching)"
          startTime: 0
          endTime: 0
        - id: blocks-hello
          title: "Compose (blocks)"
          startTime: 0
          endTime: 0
        - id: free-input-days
          title: "Type (free-input)"
          startTime: 0
          endTime: 0
        - id: mc-particles
          title: "Multiple choice"
          startTime: 0
          endTime: 0

questions:
  matching-colors:
    - type: matching
      question: "Match each color to its translation."
      pairs:
        - jp: "<ruby>赤<rt>あか</rt></ruby>"
          meaning: "red"
        - jp: "<ruby>青<rt>あお</rt></ruby>"
          meaning: "blue"
        - jp: "<ruby>白<rt>しろ</rt></ruby>"
          meaning: "white"
        - jp: "<ruby>黒<rt>くろ</rt></ruby>"
          meaning: "black"
        - jp: "<ruby>緑<rt>みどり</rt></ruby>"
          meaning: "green"
      hint: "Basic colors"

  blocks-hello:
    - type: sentence-blocks
      question: "Hello, my name is Pierre."
      blocks:
        - text: "こんにちは"
        - text: "、"
        - text: "<ruby>私<rt>わたし</rt></ruby>"
        - text: "は"
        - text: "ピエール"
        - text: "です"
      distractors:
        - text: "が"
        - text: "を"
      hint: "Greeting + self-introduction"

  free-input-days:
    - type: free-input
      question: "How do you say \"Monday\" in Japanese?"
      answers:
        - 月曜日
        - げつようび
        - getsuyoubi
      display: "<ruby>月曜日<rt>げつようび</rt></ruby>"
      hint: "The day of the moon"

  mc-particles:
    - type: multiple-choice
      question: "Which particle marks the direct object?"
      options:
        - は
        - を
        - が
        - に
      answer: 1
      hint: "\"wo\" is pronounced \"o\""
