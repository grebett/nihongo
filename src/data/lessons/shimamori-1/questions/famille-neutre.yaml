famille-parents-neutre:
  - type: matching
    question: "Reliez chaque terme à sa traduction (parents — forme neutre/modeste)."
    pairs:
      - jp: "<ruby>家族<rt>かぞく</rt></ruby>"
        meaning: "famille"
      - jp: "<ruby>父<rt>ちち</rt></ruby>"
        meaning: "mon père"
      - jp: "<ruby>母<rt>はは</rt></ruby>"
        meaning: "ma mère"
      - jp: "<ruby>両親<rt>りょうしん</rt></ruby>"
        meaning: "mes parents"
      - jp: "<ruby>親<rt>おや</rt></ruby>"
        meaning: "parent"
    hint: "Termes utilisés pour parler de sa propre famille"

  - type: matching
    question: "Reliez chaque terme à sa traduction (parents — usage descriptif)."
    pairs:
      - jp: "<ruby>父親<rt>ちちおや</rt></ruby>"
        meaning: "le père (descriptif)"
      - jp: "<ruby>母親<rt>ははおや</rt></ruby>"
        meaning: "la mère (descriptive)"
      - jp: "<ruby>家族<rt>かぞく</rt></ruby>"
        meaning: "famille"
      - jp: "<ruby>両親<rt>りょうしん</rt></ruby>"
        meaning: "parents"
    hint: "父親・母親 sont des termes descriptifs (« le père », « la mère »)"

famille-freres-soeurs-neutre:
  - type: matching
    question: "Reliez chaque terme à sa traduction (frères & sœurs — forme neutre)."
    pairs:
      - jp: "<ruby>兄<rt>あに</rt></ruby>"
        meaning: "mon frère aîné"
      - jp: "<ruby>姉<rt>あね</rt></ruby>"
        meaning: "ma sœur aînée"
      - jp: "<ruby>弟<rt>おとうと</rt></ruby>"
        meaning: "mon frère cadet"
      - jp: "<ruby>妹<rt>いもうと</rt></ruby>"
        meaning: "ma sœur cadette"
      - jp: "<ruby>兄弟<rt>きょうだい</rt></ruby>"
        meaning: "frères et sœurs / fratrie"
    hint: "Mots utilisés pour parler de ses propres frères et sœurs"

famille-conjoint-neutre:
  - type: matching
    question: "Reliez chaque terme à sa traduction (conjoint — parler du sien)."
    pairs:
      - jp: "<ruby>夫<rt>おっと</rt></ruby>"
        meaning: "mon mari / époux"
      - jp: "<ruby>主人<rt>しゅじん</rt></ruby>"
        meaning: "mon mari (lit. maître de maison)"
      - jp: "<ruby>妻<rt>つま</rt></ruby>"
        meaning: "ma femme / épouse"
      - jp: "<ruby>家内<rt>かない</rt></ruby>"
        meaning: "ma femme (lit. à l'intérieur de la maison)"
      - jp: "<ruby>夫婦<rt>ふうふ</rt></ruby>"
        meaning: "couple marié / époux"
    hint: "夫 et 妻 sont les plus neutres ; 主人 et 家内 sont plus traditionnels"

famille-enfants-neutre:
  - type: matching
    question: "Reliez chaque terme à sa traduction (enfants & petits-enfants — forme neutre)."
    pairs:
      - jp: "<ruby>子<rt>こ</rt></ruby>"
        meaning: "enfant"
      - jp: "<ruby>子<rt>こ</rt></ruby>ども"
        meaning: "enfant (forme courante)"
      - jp: "<ruby>息子<rt>むすこ</rt></ruby>"
        meaning: "mon fils"
      - jp: "<ruby>娘<rt>むすめ</rt></ruby>"
        meaning: "ma fille"
      - jp: "<ruby>孫<rt>まご</rt></ruby>"
        meaning: "petit-enfant / petits-enfants"
    hint: "息子 et 娘 sont utilisés pour parler de ses propres enfants"

famille-elargie-neutre:
  - type: matching
    question: "Reliez chaque terme à sa traduction (famille élargie — forme neutre)."
    pairs:
      - jp: "<ruby>祖父<rt>そふ</rt></ruby>"
        meaning: "mon grand-père"
      - jp: "<ruby>祖母<rt>そぼ</rt></ruby>"
        meaning: "ma grand-mère"
      - jp: "おじ"
        meaning: "mon oncle"
      - jp: "おば"
        meaning: "ma tante"
      - jp: "<ruby>甥<rt>おい</rt></ruby>"
        meaning: "mon neveu"
      - jp: "<ruby>姪<rt>めい</rt></ruby>"
        meaning: "ma nièce"
    hint: "祖父・祖母 sont les termes neutres pour ses propres grands-parents"
