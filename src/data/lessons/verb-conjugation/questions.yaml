verb-groups:
  - type: multiple-choice
    question: "How many verb groups exist in modern Japanese?"
    options: ["One", "Two (+ irregulars)", "Three", "Five"]
    answer: 1
    hint: "Ichidan and Godan, plus two irregular verbs (する and 来る)"
  - type: multiple-choice
    question: "What does 'ichidan' (<ruby>一段<rt>いちだん</rt></ruby>) literally mean?"
    options: ["Five stages", "One stage", "First verb", "Simple form"]
    answer: 1
    hint: "There's only one stage of conjugation — just drop る and add the ending"
  - type: multiple-choice
    question: "What does 'godan' (<ruby>五段<rt>ごだん</rt></ruby>) literally mean?"
    options: ["One stage", "Two stages", "Five stages", "Ten stages"]
    answer: 2
    hint: "Conjugation depends on five vowel sounds (a, i, u, e, o)"
  - type: multiple-choice
    question: "Which of these is an ichidan verb?"
    options: ["<ruby>飲<rt>の</rt></ruby>む (nomu)", "<ruby>書<rt>か</rt></ruby>く (kaku)", "<ruby>食<rt>た</rt></ruby>べる (taberu)", "<ruby>話<rt>はな</rt></ruby>す (hanasu)"]
    answer: 2
    hint: "Ichidan verbs end in -eru or -iru"
  - type: multiple-choice
    question: "Which verb is godan despite looking like ichidan?"
    options: ["<ruby>食<rt>た</rt></ruby>べる (taberu)", "<ruby>寝<rt>ね</rt></ruby>る (neru)", "<ruby>走<rt>はし</rt></ruby>る (hashiru)", "<ruby>起<rt>お</rt></ruby>きる (okiru)"]
    answer: 2
    hint: "走る ends in -iru but conjugates as godan"
  - type: multiple-choice
    question: "する and <ruby>来<rt>く</rt></ruby>る belong to which group?"
    options: ["Ichidan", "Godan", "Irregular", "Both ichidan and godan"]
    answer: 2
    hint: "They follow their own unique conjugation patterns"
  - type: multiple-choice
    question: "Which ending is NOT a godan verb ending?"
    options: ["む (mu)", "く (ku)", "ず (zu)", "す (su)"]
    answer: 2
    hint: "Godan endings are: う, く, ぐ, す, つ, ぬ, ぶ, む, る"

dictionary-form-ichidan:
  - type: multiple-choice
    question: "The dictionary form can be used for which situations?"
    options: ["Only present tense", "Only future tense", "Present, habitual, and future", "Only past tense"]
    answer: 2
    hint: "I eat sushi (now) / I eat sushi (regularly) / I will eat sushi (future)"
  - type: free-input
    question: "What is the dictionary form of 'to eat'?"
    answers: ["食べる", "たべる", "taberu"]
    hint: "An ichidan verb ending in -eru"
  - type: free-input
    question: "What is the dictionary form of 'to look/see'?"
    answers: ["見る", "みる", "miru"]
    hint: "An ichidan verb ending in -iru"
  - type: multiple-choice
    question: "How do you conjugate ichidan verbs from dictionary form?"
    options: ["Change the last vowel", "Drop る and add the new ending", "Add after the verb", "Change the whole verb"]
    answer: 1
    hint: "One stage — just drop る and add"
  - type: free-input
    question: "What is the dictionary form of 'to sleep'?"
    answers: ["寝る", "ねる", "neru"]
    hint: "An ichidan verb ending in -eru"
  - type: free-input
    question: "What is the dictionary form of 'to wake up'?"
    answers: ["起きる", "おきる", "okiru"]
    hint: "An ichidan verb ending in -iru"
  - type: free-input
    question: "What is the dictionary form of 'to teach'?"
    answers: ["教える", "おしえる", "oshieru"]
    hint: "An ichidan verb ending in -eru"

