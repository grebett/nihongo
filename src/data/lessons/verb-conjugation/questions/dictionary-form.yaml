dictionary-form-ichidan:
  - type: multiple-choice
    question: The dictionary form can be used for which situations?
    options:
      - Only present tense
      - Only future tense
      - Present, habitual, and future
      - Only past tense
    answer: 2
    hint: I eat sushi (now) / I eat sushi (regularly) / I will eat sushi (future)
  - type: free-input
    question: What is the dictionary form of 'to eat'?
    answers:
      - 食べる
      - たべる
      - taberu
    hint: An ichidan verb ending in -eru
  - type: free-input
    question: What is the dictionary form of 'to look/see'?
    answers:
      - 見る
      - みる
      - miru
    hint: An ichidan verb ending in -iru
  - type: multiple-choice
    question: How do you conjugate ichidan verbs from dictionary form?
    options:
      - Change the last vowel
      - Drop る and add the new ending
      - Add after the verb
      - Change the whole verb
    answer: 1
    hint: One stage — just drop る and add
  - type: free-input
    question: What is the dictionary form of 'to sleep'?
    answers:
      - 寝る
      - ねる
      - neru
    hint: An ichidan verb ending in -eru
  - type: free-input
    question: What is the dictionary form of 'to wake up'?
    answers:
      - 起きる
      - おきる
      - okiru
    hint: An ichidan verb ending in -iru
  - type: free-input
    question: What is the dictionary form of 'to teach'?
    answers:
      - 教える
      - おしえる
      - oshieru
    hint: An ichidan verb ending in -eru
  - type: free-input
    question: What is the dictionary form of 'to open'?
    answers:
      - 開ける
      - あける
      - akeru
    hint: An ichidan verb ending in -eru
  - type: free-input
    question: What is the dictionary form of 'to close'?
    answers:
      - 閉める
      - しめる
      - shimeru
    hint: An ichidan verb ending in -eru
  - type: free-input
    question: What is the dictionary form of 'to wear (upper body)'?
    answers:
      - 着る
      - きる
      - kiru
    hint: An ichidan verb ending in -iru
  - type: free-input
    question: What is the dictionary form of 'to shower/bathe'?
    answers:
      - 浴びる
      - あびる
      - abiru
    hint: An ichidan verb ending in -iru
  - type: free-input
    question: What is the dictionary form of 'to exit/go out'?
    answers:
      - 出る
      - でる
      - deru
    hint: An ichidan verb ending in -eru
  - type: free-input
    question: What is the dictionary form of 'to believe'?
    answers:
      - 信じる
      - しんじる
      - shinjiru
    hint: An ichidan verb ending in -iru
  - type: free-input
    question: What is the dictionary form of 'to feel'?
    answers:
      - 感じる
      - かんじる
      - kanjiru
    hint: An ichidan verb ending in -iru
  - type: free-input
    question: What is the dictionary form of 'to get off/descend'?
    answers:
      - 降りる
      - おりる
      - oriru
    hint: An ichidan verb ending in -iru
  - type: free-input
    question: What is the dictionary form of 'to borrow'?
    answers:
      - 借りる
      - かりる
      - kariru
    hint: An ichidan verb ending in -iru
  - type: multiple-choice
    question: What remains when you remove る from an ichidan verb?
    options:
      - The dictionary form
      - The verb stem
      - The polite form
      - The past tense
    answer: 1
    hint: For 食べる, removing る gives 食べ — the stem used to build other forms
  - type: multiple-choice
    question: Which of these is the stem of <ruby>起<rt>お</rt></ruby>きる (okiru)?
    options:
      - <ruby>起<rt>お</rt></ruby>き
      - <ruby>起<rt>お</rt></ruby>
      - <ruby>起<rt>お</rt></ruby>きり
      - <ruby>起<rt>お</rt></ruby>く
    answer: 0
    hint: Drop る from 起きる to get the stem 起き
  - type: multiple-choice
    question: Which of these is NOT an ichidan verb?
    options:
      - <ruby>開<rt>あ</rt></ruby>ける (akeru)
      - <ruby>閉<rt>し</rt></ruby>める (shimeru)
      - <ruby>走<rt>はし</rt></ruby>る (hashiru)
      - <ruby>出<rt>で</rt></ruby>る (deru)
    answer: 2
    hint: 走る looks like it could be ichidan but it is actually godan
  - type: free-input
    question: What is the stem of <ruby>食<rt>た</rt></ruby>べる (taberu)?
    answers:
      - 食べ
      - たべ
      - tabe
    hint: Remove る from the ichidan verb to get the stem
dictionary-form-godan:
  - type: free-input
    question: What is the dictionary form of 'to drink'?
    answers:
      - 飲む
      - のむ
      - nomu
    hint: A godan verb ending in む
  - type: free-input
    question: What is the dictionary form of 'to write'?
    answers:
      - 書く
      - かく
      - kaku
    hint: A godan verb ending in く
  - type: free-input
    question: What is the dictionary form of 'to read'?
    answers:
      - 読む
      - よむ
      - yomu
    hint: A godan verb ending in む
  - type: multiple-choice
    question: "Godan verbs conjugate based on:"
    options:
      - Just dropping る
      - Five vowel sounds (a, i, u, e, o)
      - Adding ます directly
      - Changing the first syllable
    answer: 1
    hint: The う-row (dictionary) changes to あ, い, え, お rows depending on the form
