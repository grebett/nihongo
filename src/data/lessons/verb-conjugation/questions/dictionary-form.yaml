  - type: free-input
    question: What is the dictionary form of 'to stand'?
    answers:
      - 立つ
      - たつ
      - tatsu
    hint: A godan verb ending in つ
  - type: multiple-choice
    question: Which row of the kana chart does the dictionary form of godan verbs always end in?
    options:
      - あ-row (a)
      - い-row (i)
      - う-row (u)
      - え-row (e)
    answer: 2
    hint: む, く, す, つ, う, ぐ, ぶ, ぬ, る — all are in the う-row
  - type: multiple-choice
    question: Which of these godan verbs ends in る?
    options:
      - <ruby>飲<rt>の</rt></ruby>む (nomu)
      - <ruby>座<rt>すわ</rt></ruby>る (suwaru)
      - <ruby>泳<rt>およ</rt></ruby>ぐ (oyogu)
      - <ruby>話<rt>はな</rt></ruby>す (hanasu)
    answer: 1
    hint: 座る (to sit) is a godan verb that ends in る
  - type: multiple-choice
    question: How many possible final kana can a godan verb have in dictionary form?
    options:
      - 5
      - 7
      - 9
      - 2
    answer: 2
    hint: "う, く, ぐ, す, つ, ぬ, ぶ, む, る — nine possible endings"
  - type: free-input
    question: What is the dictionary form of 'to use'?
    answers:
      - 使う
      - つかう
      - tsukau
    hint: A godan verb ending in う
dictionary-form-test:
  - type: multiple-choice
    question: Which verb is godan despite ending in -iru?
    options:
      - <ruby>見<rt>み</rt></ruby>る (miru)
      - <ruby>走<rt>はし</rt></ruby>る (hashiru)
      - <ruby>起<rt>お</rt></ruby>きる (okiru)
      - <ruby>食<rt>た</rt></ruby>べる (taberu)
    answer: 1
    hint: 走る (to run) is a godan verb — it conjugates differently from ichidan
  - type: multiple-choice
    question: Which verb is godan despite ending in -eru?
    options:
      - <ruby>食<rt>た</rt></ruby>べる (taberu)
      - <ruby>寝<rt>ね</rt></ruby>る (neru)
      - <ruby>帰<rt>かえ</rt></ruby>る (kaeru)
      - <ruby>見<rt>み</rt></ruby>える (mieru)
    answer: 2
    hint: 帰る (to return) is godan
  - type: multiple-choice
    question: What are the two irregular verbs in Japanese?
    options:
      - <ruby>行<rt>い</rt></ruby>く and <ruby>帰<rt>かえ</rt></ruby>る
      - する and <ruby>来<rt>く</rt></ruby>る
      - ある and いる
      - <ruby>食<rt>た</rt></ruby>べる and <ruby>飲<rt>の</rt></ruby>む
    answer: 1
    hint: する (to do) and 来る (to come)
  - type: multiple-choice
    question: Which of these verbs is ichidan?
    options:
      - <ruby>買<rt>か</rt></ruby>う (kau)
      - <ruby>泳<rt>およ</rt></ruby>ぐ (oyogu)
      - <ruby>寝<rt>ね</rt></ruby>る (neru)
      - <ruby>待<rt>ま</rt></ruby>つ (matsu)
    answer: 2
    hint: Ichidan verbs end in -eru or -iru and drop る to conjugate
  - type: multiple-choice
    question: Which verb group does <ruby>勉強<rt>べんきょう</rt></ruby>する belong to?
    options:
      - Ichidan
      - Godan
      - Irregular
      - It depends on the sentence
    answer: 2
    hint: Noun + する verbs are irregular — they conjugate like する
  - type: free-input
    question: What is the dictionary form of 'to swim'?
    answers:
      - 泳ぐ
      - およぐ
      - oyogu
    hint: A godan verb ending in ぐ
  - type: free-input
    question: What is the dictionary form of 'to play'?
    answers:
      - 遊ぶ
      - あそぶ
      - asobu
    hint: A godan verb ending in ぶ
  - type: multiple-choice
    question: Which ending is shared by both godan and ichidan verbs?
    options:
      - む (mu)
      - す (su)
      - る (ru)
      - く (ku)
    answer: 2
    hint: Some -ru verbs are ichidan (食べる) and some are godan (走る)
  - type: free-input
    question: What is the dictionary form of 'to do'?
    answers:
      - する
      - suru
    hint: One of the two irregular verbs
  - type: free-input
    question: What is the dictionary form of 'to come'?
    answers:
      - 来る
      - くる
      - kuru
    hint: One of the two irregular verbs
  - type: multiple-choice
    question: How can you tell <ruby>起<rt>お</rt></ruby>きる is ichidan and not godan?
    options:
      - It ends in -iru so it must be ichidan
      - You must memorize it — -iru verbs can be either group
      - All verbs with kanji are ichidan
      - It has more than two syllables
    answer: 1
    hint: Some -iru verbs like 走る are godan; you have to learn which group each belongs to
  - type: multiple-choice
    question: Which of these is a godan verb?
    options:
      - <ruby>教<rt>おし</rt></ruby>える (oshieru)
      - <ruby>見<rt>み</rt></ruby>る (miru)
      - <ruby>読<rt>よ</rt></ruby>む (yomu)
      - する (suru)
    answer: 2
    hint: 読む ends in む, which is exclusively a godan ending
  - type: free-input
    question: What is the dictionary form of 'to speak'?
    answers:
      - 話す
      - はなす
      - hanasu
    hint: A godan verb ending in す
  - type: multiple-choice
    question: Which statement about dictionary form is true?
    options:
      - It can only express present tense
      - It is only used in dictionaries
      - It can express present, habitual, and future actions
      - It is the same as polite form
    answer: 2
    hint: The dictionary form (plain present) covers present, habitual, and future meanings
  - type: free-input
    question: What is the dictionary form of 'to cook'?
    answers:
      - 料理する
      - りょうりする
      - ryourisuru
    hint: A noun + する (irregular) verb
  - type: multiple-choice
    question: <ruby>歩<rt>ある</rt></ruby>く (aruku) belongs to which verb group?
    options:
      - Ichidan
      - Godan
      - Irregular
      - Both ichidan and godan
    answer: 1
    hint: It ends in く, which is exclusively a godan ending
  - type: free-input
    question: What is the dictionary form of 'to close'?
    answers:
      - 閉める
      - しめる
      - shimeru
    hint: An ichidan verb ending in -eru
  - type: free-input
    question: What is the dictionary form of 'to sit'?
    answers:
      - 座る
      - すわる
      - suwaru
    hint: A godan verb ending in る — the vowel before る is a, not i or e
  - type: free-input
    question: What is the dictionary form of 'to use'?
    answers:
      - 使う
      - つかう
      - tsukau
    hint: A godan verb ending in う
  - type: multiple-choice
    question: Which verb is ichidan?
    options:
      - <ruby>作<rt>つく</rt></ruby>る (tsukuru)
      - <ruby>降<rt>お</rt></ruby>りる (oriru)
      - <ruby>送<rt>おく</rt></ruby>る (okuru)
      - <ruby>立<rt>た</rt></ruby>つ (tatsu)
    answer: 1
    hint: 降りる (to get off) ends in -iru and is a true ichidan verb
