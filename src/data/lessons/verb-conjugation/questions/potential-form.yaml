    options:
      - <ruby>来<rt>く</rt></ruby>る
      - <ruby>食<rt>た</rt></ruby>べる
      - する
      - <ruby>行<rt>い</rt></ruby>く
    answer: 2
    hint: する → できる — no other verb changes so drastically
